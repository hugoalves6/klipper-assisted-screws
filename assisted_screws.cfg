# Example configuration. Screws, thread, horizontal_move_z and speed are read
# from [screws_tilt_adjust], which must also be configured. [save_variables]
# is used to remember print hours and the last calibration.
[assisted_screws]
tolerance: 0.02          # mm a screw must stay within, against the reference
confirm: 3               # consecutive probes within tolerance before moving on
interval: 3              # seconds between probes while adjusting
timeout: 300             # seconds allowed per screw
lift: 2                  # mm lift between probes
max_rounds: 3            # screw levelling rounds before giving up
check_z: 0.8             # nozzle z at which the probe must already be triggered
gantry_height: 50        # z used by ASSISTED_GANTRY_CHECK for manual measuring
stall_current: 0.25      # A, Z motor current while lowering onto the stops
stop_height: 44.8        # mm, height of the stops
#gantry_base_offset:     # mm, X axis end bottom above the stop base with nozzle at z=0
stall_margin: 3          # mm lowered beyond the stops (with gantry_base_offset)
min_nozzle_z: 5          # without gantry_base_offset, lower until the nozzle is here
stops_z: 60              # z raised to so the stops can be inserted
stall_x: -5              # nozzle X off the bed while lowering onto the stops
raise_after_stall: 30    # mm raised after the stall so the stops can be removed
recalibrate_hours: 200   # print hours before a recalibration reminder at boot

# Shows up as a button in the Mainsail/Fluidd Macros panel
[gcode_macro BED_CALIBRATE]
description: Guided bed calibration (stops, assisted screws, z_tilt)
gcode:
    ASSISTED_BED_CALIBRATE
